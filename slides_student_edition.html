    .projector-theme {
      --bg-page: #f1f5f9;
      --bg-slide: #ffffff;

      --text-sub: #334155;

      --indigo-brand: #4f46e5;

      --rose-brand: #e11d48;

    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .slide-fade { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes wheelSpinFwd {
      from { background-position-y: 0px; }
      to { background-position-y: -28px; }
    }
    @keyframes wheelSpinRev {
      from { background-position-y: 0px; }
      to { background-position-y: 28px; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .tread-pattern {
      background-image: repeating-linear-gradient(
        0deg,
        #1e293b,
        #1e293b 7px,
        #facc15 7px,
        #facc15 14px
      );
    }
  </style>
</head>

    function updatePwmSim(val) {
      currentPwmValue = parseInt(val);
      const slider = document.getElementById('pwm-slider');
      const valBadge = document.getElementById('pwm-val-badge');
      const dutyBadge = document.getElementById('pwm-duty-badge');
      const avgVolt = document.getElementById('pwm-avg-volt');
      const wheelIcon = document.getElementById('pwm-wheel-icon');
      const motorStatus = document.getElementById('pwm-motor-status');
      const canvas = document.getElementById('pwm-canvas');

      if (slider) slider.value = currentPwmValue;
      const duty = Math.round((currentPwmValue / 255) * 100);
      if (valBadge) valBadge.textContent = `ledcWrite(ch, ${currentPwmValue})`;
      if (dutyBadge) dutyBadge.textContent = `เปิดไฟ: ${duty}%`;
      if (avgVolt) avgVolt.textContent = `ไฟเฉลี่ย ~${duty}% (${((3.3 * currentPwmValue) / 255).toFixed(1)}V)`;

      if (wheelIcon && motorStatus) {
        if (currentPwmValue === 0) {
          wheelIcon.style.animation = 'none';
          motorStatus.textContent = 'หยุดนิ่ง (0%)';
        } else {
          const duration = Math.max(0.18, 1.5 - (currentPwmValue / 255) * 1.3);
          wheelIcon.style.animation = `spin ${duration}s linear infinite`;
          motorStatus.textContent = currentPwmValue > 220 ? `หมุนเร็วสุด! (${duty}%)` :
                                    currentPwmValue > 100 ? `หมุนปานกลาง (${duty}%)` : `หมุนช้าๆ (${duty}%)`;
        }
      }

      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const padX = 46, padY = 20;
        const w = canvas.width - padX - 14;
        const h = canvas.height - padY * 2;
        const cycles = 4;
        const cycleW = w / cycles;
        const dutyRatio = currentPwmValue / 255;

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(padX, padY); ctx.lineTo(padX + w, padY);
        ctx.moveTo(padX, padY + h); ctx.lineTo(padX + w, padY + h);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 11px monospace';
        ctx.fillText('HIGH', 6, padY + 4);
        ctx.fillText('LOW', 10, padY + h + 4);

        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < cycles; i++) {
          const x0 = padX + i * cycleW;
          const xHighEnd = x0 + cycleW * dutyRatio;
          const x1 = x0 + cycleW;

          if (dutyRatio === 0) {
            ctx.moveTo(x0, padY + h);
            ctx.lineTo(x1, padY + h);
          } else if (dutyRatio === 1) {
            ctx.moveTo(x0, padY);
            ctx.lineTo(x1, padY);
          } else {
            ctx.moveTo(x0, padY + h);
            ctx.lineTo(x0, padY);
            ctx.lineTo(xHighEnd, padY);
            ctx.lineTo(xHighEnd, padY + h);
            ctx.lineTo(x1, padY + h);
          }
        }
        ctx.stroke();
      }
    }

    function playSimBeep(ms) {
      const statusEl = document.getElementById('beep-status');
      if (statusEl) {
        statusEl.textContent = `🔊 digitalWrite(BUZZER, HIGH) ... รอ ${ms} ms ...`;
      }
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = 2200;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          osc.stop();
          ctx.close();
          if (statusEl) statusEl.textContent = `🔇 digitalWrite(BUZZER, LOW) (ครบ ${ms} ms เงียบแล้ว!)`;
        }, ms);
      } catch (e) {
        setTimeout(() => {
          if (statusEl) statusEl.textContent = `🔇 digitalWrite(BUZZER, LOW) (ครบ ${ms} ms)`;
        }, ms);
      }
    }

    function setDriveSim(l, r) {
      const wl = document.getElementById('sim-wheel-l');
      const wr = document.getElementById('sim-wheel-r');
      const vl = document.getElementById('sim-val-l');
      const vr = document.getElementById('sim-val-r');
      const desc = document.getElementById('sim-car-desc');
      if (!wl) return;

      vl.textContent = `L = ${l}`;
      vr.textContent = `R = ${r}`;

      wl.style.animation = l > 0 ? 'wheelSpinFwd 0.4s linear infinite' : l < 0 ? 'wheelSpinRev 0.4s linear infinite' : 'none';
      wr.style.animation = r > 0 ? 'wheelSpinFwd 0.4s linear infinite' : r < 0 ? 'wheelSpinRev 0.4s linear infinite' : 'none';

      if (l > 0 && r > 0) {
        desc.textContent = 'วิ่งเดินหน้าตรง';
      } else if (l < 0 && r < 0) {
        desc.textContent = 'วิ่งถอยหลังตรง';
      } else if (l > 0 && r < 0) {
        desc.textContent = 'หมุนเลี้ยวขวาอยู่กับที่';
      } else if (l < 0 && r > 0) {
        desc.textContent = 'หมุนเลี้ยวซ้ายอยู่กับที่';
      } else {
        desc.textContent = 'จอดสนิท (PWM = 0)';
      }
    }

    function toggleGripperSim() {
      gripperOpen = !gripperOpen;
      const el = document.getElementById('gripper-status');
      if (!el) return;
      if (gripperOpen) {
        el.textContent = '🦞 กางออก! (90°)';
      } else {
        el.textContent = '🦀 หุบเข้า! (0°)';
      }
    }

    function runHomingSim() {
      const bar = document.getElementById('homing-arm-bar');
      const log = document.getElementById('homing-log');
      if (!bar || !log) return;

      bar.style.marginLeft = '68%';
      log.textContent = 'กำลังหมุนแขนกลลงหาสวิตช์...';

      let pos = 68;
      const timer = setInterval(() => {
        pos -= 10;
        if (pos <= 0) {
          pos = 0;
          bar.style.marginLeft = '0%';
          clearInterval(timer);
          log.textContent = '✅ ชนสวิตช์แล้ว! หยุดทันที + ตั้งจุด 0° สำเร็จ!';
          playSimBeep(120);
        } else {
          bar.style.marginLeft = pos + '%';
        }
      }, 140);
    }

    initDeck();
  </script>
</body>
</html>
