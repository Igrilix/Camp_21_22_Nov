<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สไลด์ค่ายหุ่นยนต์ ESP32 (ฉบับ 60 นาที)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #0f172a;
      --foreground: #f8fafc;
      --card: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-foreground: #0f172a;
      --secondary: #334155;
      --secondary-foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
    }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .slide-fade { animation: fadeIn 0.22s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes wheelSpinFwd {
      from { background-position-y: 0px; }
      to { background-position-y: -24px; }
    }
    @keyframes wheelSpinRev {
      from { background-position-y: 0px; }
      to { background-position-y: 24px; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .tread-pattern {
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 6px,
        rgba(148,163,184,0.45) 6px,
        rgba(148,163,184,0.45) 12px
      );
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-3 md:p-6 m-0 select-none min-h-screen flex flex-col justify-center">

  <div id="deck-root" class="max-w-6xl w-full mx-auto flex flex-col gap-3">
    <!-- Top Header & Controls -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 shadow-sm">
      <div class="flex items-center gap-2.5">
        <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-[var(--primary)] text-[var(--primary-foreground)]">
          ESP32 ROBOTICS CAMP
        </span>
        <span id="phase-badge" class="px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--secondary)] text-[var(--secondary-foreground)]">
          ช่วงที่ 1 (นาที 00–08)
        </span>
        <span id="role-badge" class="px-2.5 py-1 rounded-md text-xs font-semibold border border-[var(--border)]">
          🎤 ผู้สอน A + 🤖 ผู้สอน B
        </span>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="prevSlide()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 active:scale-95 transition">
          ◀ ก่อนหน้า
        </button>
        <select id="slide-jump" onchange="goToSlide(parseInt(this.value))" class="px-2 py-1.5 rounded-lg text-xs font-semibold bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)]">
        </select>
        <button onclick="nextSlide()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 active:scale-95 transition">
          ถัดไป ▶
        </button>
        <button onclick="toggleNotes()" id="notes-btn" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] hover:bg-[var(--secondary)] transition" title="ซ่อน/แสดงโพยผู้สอน (กดปุ่ม N)">
          📝 โพยผู้สอน
        </button>
        <button onclick="toggleFullscreen()" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] hover:bg-[var(--secondary)] transition" title="ขยายเต็มจอ (กดปุ่ม F)">
          ⛶ เต็มจอ
        </button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full h-1.5 bg-[var(--secondary)] rounded-full overflow-hidden">
      <div id="progress-bar" class="h-full bg-[var(--primary)] transition-all duration-300" style="width: 6%"></div>
    </div>

    <!-- Main Slide Stage -->
    <div id="slide-stage" class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 md:p-10 shadow-lg min-h-[500px] flex flex-col justify-between slide-fade">
    </div>

    <!-- Speaker Notes Bar (Co-Teaching Guide) -->
    <div id="speaker-notes" class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 text-xs space-y-1.5">
      <div class="flex items-center justify-between text-[var(--muted-foreground)] font-semibold">
        <span>💡 โพยสำหรับผู้สอน 2 คน (กดปุ่ม <kbd class="px-1.5 py-0.5 rounded bg-[var(--secondary)]">N</kbd> เพื่อซ่อนเวลาฉายขึ้นโปรเจกเตอร์จริง | กดลูกศรซ้าย-ขวาเพื่อเปลี่ยนหน้า)</span>
        <span id="time-hint" class="font-mono">เวลาแนะนำ: 2 นาที</span>
      </div>
      <div id="notes-content" class="text-sm leading-relaxed text-[var(--foreground)]"></div>
    </div>
  </div>

  <script>
    const slides = [
      {
        phase: "ช่วงที่ 1: เปิดตัวหุ่นยนต์ & ESP32 (นาที 00–08)",
        role: "🎤 ผู้สอน A พูดเปิด + 🤖 ผู้สอน B บังคับหุ่นยนต์โชว์",
        time: "2 นาที",
        title: "🤖 สร้างและสั่งงานหุ่นยนต์อัจฉริยะด้วย ESP32",
        subtitle: "เปลี่ยนมือถือธรรมดา ให้กลายเป็นจอยบังคับหุ่นยนต์ด้วยโค้ดภาษา C/C++",
        notes: "<b>ผู้สอน B:</b> เปิดสวิตช์หุ่นยนต์ให้ร้องปี๊บ แขนกลเลื่อนลงมาชนสวิตช์เอง แล้วใช้มือถือบังคับรถวิ่งและคีบของโชว์น้องๆ<br><b>ผู้สอน A:</b> ชวนน้องคุยว่าหุ่นยนต์ตัวนี้ไม่ได้ใช้รีโมทราคาแพง แต่ปล่อย Wi-Fi ออกมาจากสมองกลจิ๋ว วันนี้ใน 60 นาที เราจะมาแกะความลับและแก้โค้ดหุ่นยนต์ตัวนี้กัน!",
        render: () => `

              <ul class="text-xs md:text-sm text-left space-y-2 text-[var(--muted-foreground)] w-full max-w-sm">
                <li class="flex items-center gap-2">✅ <span>ปล่อย <b>Wi-Fi ("ESP32-CAR")</b> ให้มือถือเข้ามาบังคับได้</span></li>
                <li class="flex items-center gap-2">✅ <span>ขับเคลื่อน <b>2 ล้อ (ซ้าย-ขวา)</b> เดินหน้า ถอยหลัง หมุนตัว</span></li>

              </ul>
            </div>
          </div>
        `

                      <line x1="51" y1="68" x2="51" y2="81" stroke="#eab308" stroke-width="3"/>
                      <line x1="66" y1="68" x2="66" y2="81" stroke="#eab308" stroke-width="3"/>
                      <text x="51" y="94" text-anchor="middle" fill="currentColor" font-size="9.5" font-weight="bold">IR Sensor</text>
                    </g>
                  </svg>
                </div>

                <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] text-xs space-y-1">
                  <div>🔘 <b>Limit Switch (ขา 25):</b> ปุ่มรับรู้เมื่อแขนกลเลื่อนลงสุด</div>
                  <div>🔴 <b>IR Sensor (ขา 26):</b> ตาอินฟราเรดตรวจจับวัตถุ</div>

                <div>
                  <div class="flex items-center justify-between">

                      <rect x="10" y="6" width="190" height="68" rx="5" fill="#0f172a" stroke="#475569" stroke-width="2"/>
                      <g fill="#eab308">

                        <rect x="42" y="72" width="4" height="7" rx="1"/><rect x="52" y="72" width="4" height="7" rx="1"/><rect x="62" y="72" width="4" height="7" rx="1"/><rect x="72" y="72" width="4" height="7" rx="1"/><rect x="82" y="72" width="4" height="7" rx="1"/><rect x="92" y="72" width="4" height="7" rx="1"/><rect x="102" y="72" width="4" height="7" rx="1"/><rect x="112" y="72" width="4" height="7" rx="1"/><rect x="122" y="72" width="4" height="7" rx="1"/><rect x="132" y="72" width="4" height="7" rx="1"/><rect x="142" y="72" width="4" height="7" rx="1"/><rect x="152" y="72" width="4" height="7" rx="1"/><rect x="162" y="72" width="4" height="7" rx="1"/><rect x="172" y="72" width="4" height="7" rx="1"/>

    function updatePwmSim(val) {
      currentPwmValue = parseInt(val);
      const slider = document.getElementById('pwm-slider');
      const valBadge = document.getElementById('pwm-val-badge');
      const dutyBadge = document.getElementById('pwm-duty-badge');
      const avgVolt = document.getElementById('pwm-avg-volt');
      const wheelIcon = document.getElementById('pwm-wheel-icon');
      const motorStatus = document.getElementById('pwm-motor-status');
      const canvas = document.getElementById('pwm-canvas');

      if (slider) slider.value = currentPwmValue;
      const duty = Math.round((currentPwmValue / 255) * 100);
      if (valBadge) valBadge.textContent = `ledcWrite(ch, ${currentPwmValue})`;
      if (dutyBadge) dutyBadge.textContent = `Duty Cycle: ${duty}%`;
      if (avgVolt) avgVolt.textContent = `ไฟเฉลี่ย ~${duty}% (${((3.3 * currentPwmValue) / 255).toFixed(1)}V)`;

      if (wheelIcon && motorStatus) {
        if (currentPwmValue === 0) {
          wheelIcon.style.animation = 'none';
          motorStatus.textContent = 'หยุดนิ่ง (0%)';
        } else {
          const duration = Math.max(0.18, 1.5 - (currentPwmValue / 255) * 1.3);
          wheelIcon.style.animation = `spin ${duration}s linear infinite`;
          motorStatus.textContent = currentPwmValue > 220 ? `หมุนเร็วมาก! (${duty}%)` :
                                    currentPwmValue > 100 ? `หมุนปานกลาง (${duty}%)` : `หมุนช้าๆ (${duty}%)`;
        }
      }

      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const padX = 36, padY = 20;
        const w = canvas.width - padX - 12;
        const h = canvas.height - padY * 2;
        const cycles = 4;
        const cycleW = w / cycles;
        const dutyRatio = currentPwmValue / 255;

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(padX, padY); ctx.lineTo(padX + w, padY);
        ctx.moveTo(padX, padY + h); ctx.lineTo(padX + w, padY + h);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px monospace';
        ctx.fillText('HIGH', 4, padY + 4);
        ctx.fillText('LOW', 8, padY + h + 4);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i < cycles; i++) {
          const x0 = padX + i * cycleW;
          const xHighEnd = x0 + cycleW * dutyRatio;
          const x1 = x0 + cycleW;

          if (dutyRatio === 0) {
            ctx.moveTo(x0, padY + h);
            ctx.lineTo(x1, padY + h);
          } else if (dutyRatio === 1) {
            ctx.moveTo(x0, padY);
            ctx.lineTo(x1, padY);
          } else {
            ctx.moveTo(x0, padY + h);
            ctx.lineTo(x0, padY);
            ctx.lineTo(xHighEnd, padY);
            ctx.lineTo(xHighEnd, padY + h);
            ctx.lineTo(x1, padY + h);
          }
        }
        ctx.stroke();
      }
    }

    function playSimBeep(ms) {
      const statusEl = document.getElementById('beep-status');
      if (statusEl) {
        statusEl.textContent = `🔊 digitalWrite(BUZZER, HIGH) ... รอ ${ms} ms ...`;
      }
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = 2200;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          osc.stop();
          ctx.close();
          if (statusEl) statusEl.textContent = `🔇 digitalWrite(BUZZER, LOW) (ครบ ${ms} ms เงียบแล้ว!)`;
        }, ms);
      } catch (e) {
        setTimeout(() => {
          if (statusEl) statusEl.textContent = `🔇 digitalWrite(BUZZER, LOW) (ครบ ${ms} ms)`;
        }, ms);
      }
    }

    }

    function runHomingSim() {
      const bar = document.getElementById('homing-arm-bar');
      const log = document.getElementById('homing-log');
      if (!bar || !log) return;

      bar.style.marginLeft = '70%';
      log.textContent = 'while (!limitPressed()): กำลังหมุนแขนกลลงหาสวิตช์...';

      let pos = 70;
      const timer = setInterval(() => {
        pos -= 10;
        if (pos <= 0) {
          pos = 0;
          bar.style.marginLeft = '0%';
          clearInterval(timer);
          log.textContent = '✅ ชนสวิตช์แล้ว! (limitPressed() == true) ➔ homeStop() + hitBeep() ตั้งจุด 0° สำเร็จ!';
          playSimBeep(120);
        } else {
          bar.style.marginLeft = pos + '%';
        }
      }, 140);
    }

    initDeck();
  </script>
</body>
</html>
